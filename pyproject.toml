[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gis2dgs"
version = "1.0.0"
description = "Universal, schema-driven electrical-network data to DIgSILENT PowerFactory DGS converter."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "networkx>=3.3",
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "pyogrio>=0.11",
]

[project.scripts]
gis2dgs = "gis2dgs.cli.main:main"
gis2dgs-gui = "gis2dgs.cli.gui:launch_gui"

[project.optional-dependencies]
postgresql = [
    "psycopg[binary]>=3.2",
]
sqlserver = [
    "pyodbc>=5.1",
]
oracle = [
    "oracledb>=2.0",
]
parquet = [
    "pyarrow>=16",
]
excel-legacy = [
    "xlrd>=2.0",
]
mysql = [
    "pymysql>=1.1",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = [
    "ignore:Conversion of an array with ndim > 0 to a scalar is deprecated:DeprecationWarning:pyproj.*",
]
markers = [
    "postgis: real PostGIS integration tests; require GIS2DGS_POSTGIS_TEST_URL",
    "mssql: live SQL Server restore tests; require GIS2DGS_MSSQL_URL or a reachable instance",
    "external_reference: tests against user-provided real input/DGS reference files",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_optional = true

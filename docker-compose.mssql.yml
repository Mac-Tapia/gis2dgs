# SQL Server for GIS2DGS backup restore (Docker).
# Password is never committed: set GIS2DGS_MSSQL_SA_PASSWORD in the shell.
# Start: .\scripts\ensure_mssql.ps1
services:
  gis2dgs-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gis2dgs-mssql
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${GIS2DGS_MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "${GIS2DGS_MSSQL_PORT:-1433}:1433"
    volumes:
      - ./output/mssql/backup:/var/opt/mssql/backup
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 25s
